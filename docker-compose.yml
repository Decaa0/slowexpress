# Local, reproducible run: Postgres + one-off migration/seed + the app.
#   cp .env.example .env && docker compose up --build
# then open http://localhost:${APP_PORT:-8080}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - slowexpress_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run seed"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  slowexpress_pgdata:
